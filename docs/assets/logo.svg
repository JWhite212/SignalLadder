<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title">
  <title id="title">SignalLadder</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26335A"/>
      <stop offset="1" stop-color="#0C1224"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="92" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4D3D"/>
      <stop offset="0.45" stop-color="#FF8A2B"/>
      <stop offset="1" stop-color="#FFC857"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="250" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A2B" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8A2B" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="40" y="36" width="432" height="432" rx="98" fill="url(#body)"/>
  </g>
  <rect x="41" y="37" width="430" height="430" rx="97" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <!-- noise: faint rungs that never became a signal -->
  <g fill="#8C9CC4" opacity="0.16">
    <rect x="78"  y="150" width="44" height="14" rx="7"/>
    <rect x="70"  y="214" width="30" height="14" rx="7"/>
    <rect x="84"  y="278" width="52" height="14" rx="7"/>
    <rect x="72"  y="342" width="36" height="14" rx="7"/>
    <rect x="390" y="182" width="42" height="14" rx="7"/>
    <rect x="404" y="246" width="30" height="14" rx="7"/>
    <rect x="378" y="310" width="54" height="14" rx="7"/>
    <rect x="398" y="374" width="34" height="14" rx="7"/>
  </g>

  <circle cx="256" cy="262" r="190" fill="url(#glow)"/>

  <!-- the bell, built from ladder rungs -->
  <g fill="url(#bell)">
    <rect x="198" y="126" width="116" height="24" rx="12"/>
    <rect x="174" y="162" width="164" height="24" rx="12"/>
    <rect x="165" y="198" width="182" height="24" rx="12"/>
    <rect x="161" y="234" width="190" height="24" rx="12"/>
    <rect x="156" y="270" width="200" height="24" rx="12"/>
    <rect x="140" y="306" width="232" height="24" rx="12"/>
    <rect x="106" y="342" width="300" height="24" rx="12"/>
    <circle cx="256" cy="398" r="22"/>
  </g>
  <circle cx="256" cy="104" r="13" fill="none" stroke="#FF4D3D" stroke-width="9"/>
</svg>
