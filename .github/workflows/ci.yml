name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "LICENSE", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26, Xcode 26.6
            runner: macos-26
            xcode: "26.6"
          # The oldest OS whose runner image is not being retired, with its
          # default Xcode. macOS 14 is the declared minimum, but its runner
          # image is deprecated and being retired.
          - name: macOS 15, Xcode 16.4
            runner: macos-15
            xcode: "16.4"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Warnings fail the build: the project keeps zero, and a new one is
      # easier to fix the day it appears.
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test --skip-build
