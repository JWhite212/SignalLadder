name: CI

# Every push to main and every pull request gets a run, so the one required
# check, CI result, always reports. A change only to Markdown, docs, the
# licence or the issue forms builds nothing: the changes job says so, the build
# and test job is skipped, and CI result passes. docs/privacy.md is the
# exception: NoNetworkTests reads its search from that page, so a change to the
# page alone is checked like code.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request makes its older run pointless, so that run is
# cancelled. A push to main is never cancelled: each commit has a group of its
# own, since a later commit that changes only documentation builds nothing, and
# cancelling the run before it would leave that commit's code never built.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Decides whether code changed, from the files the push or pull request
  # changed, and prints them with the answer. Anything it cannot read counts as
  # code, so a mistake here builds more and never less.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          code=true
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range") && [ -n "$files" ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                docs/privacy.md) code=true ;;
                *.md|docs/*|LICENSE|.github/ISSUE_TEMPLATE/*) ;;
                *) code=true ;;
              esac
              echo "$file"
            done <<< "$files"
          fi
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 26, Xcode 26.6
            runner: macos-26
            xcode: "26.6"
          # The oldest OS whose runner image is not being retired, with its
          # default Xcode. macOS 14 is the declared minimum, but its runner
          # image is deprecated and being retired.
          - name: macOS 15, Xcode 16.4
            runner: macos-15
            xcode: "16.4"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Warnings fail the build: the project keeps zero, and a new one is
      # easier to fix the day it appears.
      - name: Build
        run: swift build --build-tests -Xswiftc -warnings-as-errors

      # The log is kept for the step that reads the count and the skips from it.
      # The shell is named so that a failing run still fails the step through
      # the pipe.
      - name: Test
        shell: bash
        run: swift test --skip-build 2>&1 | tee "$RUNNER_TEMP/swift-test.log"

      # The configuration that ships, as Scripts/make-app.sh builds it. The
      # optimiser can warn where a debug build does not.
      - name: Build the release configuration
        run: swift build -c release --product SignalLadder -Xswiftc -warnings-as-errors

      # Every script parsed by the system bash, which is the shell they are
      # written for and the one whose parser has bitten them before. This
      # parses and runs nothing.
      - name: Parse the scripts
        run: for script in Scripts/*.sh; do /bin/bash -n "$script" || exit 1; done

      # Speech is tested for real only where the voices are installed, so a
      # skipped test is a test that did not run. The macOS 15 runner has the
      # voices, and nothing there may be skipped. The macOS 26 runner lacks
      # them and skips some, so it is held to the count only. Both must run at
      # least as many tests as docs/architecture.md says the suite has, so a
      # target that stops being built, or a test that is dropped, fails here
      # and is not noticed later. A run that prints no totals fails too. The
      # totals are the lines after each "All tests" line, one for each of the
      # test bundles.
      - name: Check the test count and the skips
        shell: bash
        env:
          NO_SKIPS: ${{ matrix.runner == 'macos-15' }}
        run: |
          expected=$(sed -n 's/.*it runs \([0-9][0-9]*\) tests.*/\1/p' docs/architecture.md)
          case "$expected" in
            ''|*[!0-9]*) echo "docs/architecture.md does not give the test count once"; exit 1 ;;
          esac
          totals=$(awk '/^Test Suite .All tests. (passed|failed)/ { want = 1; next } want && /Executed [0-9]+ test/ { print; want = 0 }' "$RUNNER_TEMP/swift-test.log")
          ran=$(echo "$totals" | sed -n 's/.*Executed \([0-9][0-9]*\) test.*/\1/p' | awk '{ n += $1 } END { print n + 0 }')
          skipped=$(echo "$totals" | sed -n 's/.* with \([0-9][0-9]*\) tests\{0,1\} skipped.*/\1/p' | awk '{ n += $1 } END { print n + 0 }')
          echo "ran $ran, skipped $skipped, the documented count is $expected"
          if [ "$ran" -lt "$expected" ]; then
            echo "fewer tests ran than docs/architecture.md says the suite has"
            exit 1
          fi
          if [ "$NO_SKIPS" = true ] && [ "$skipped" -gt 0 ]; then
            echo "tests were skipped on a runner that has the voices"
            exit 1
          fi

      # The live harness's guards stand between it and a real page or the owner's
      # rules, so they are proven here, on both toolchains' runners, by a script
      # that starts no app, posts no notification and reads only its fixtures and a
      # temporary folder (M5 plan, Task 9). It runs under the system bash, which is
      # the shell the guards are written for.
      - name: Harness guards
        run: Scripts/harness-guards-test.sh

  # The one check main requires. It passes when both jobs of the matrix passed,
  # or when the changes job found no code and the matrix was skipped. Anything
  # else, a failure, a cancelled run or a skipped matrix after code changed,
  # fails it.
  result:
    name: CI result
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "changes: $CHANGES, code: $CODE, build and test: $TEST"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then [ "$TEST" = success ]; else [ "$TEST" = skipped ]; fi
